<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー編集</title>
</head>
<body>
    <h1>ユーザー編集</h1>

    <form th:action="@{/users/{id}/update(id=${user.id})}" method="post">
        <label>名前：</label>
        <input type="text"
               name="name"
               th:value="${user.name}"
               required>

        <button type="submit">更新</button>
    </form>

    <a th:href="@{/users/{id}(id=${user.id})}">戻る</a>
</body>
</html>
