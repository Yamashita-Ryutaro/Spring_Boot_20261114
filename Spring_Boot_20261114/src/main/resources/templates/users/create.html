<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
</head>
<body>
    <h1>ユーザー登録</h1>

    <form th:action="@{/users/store}" method="post">
        <label>名前：</label>
        <input type="text" name="name" required>

        <button type="submit">登録</button>
    </form>

    <a th:href="@{/users}">一覧に戻る</a>
</body>
</html>
